name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the held-out retrieval evaluation and the refusal-gate calibration test.
      - run: npm test

  resume:
    name: Build résumé PDF from LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume/resume.pdf

  build:
    name: Static export
    needs: [check, resume]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: resume-build
      - name: Use the freshly compiled résumé
        run: cp resume-build/resume.pdf public/Srinivasan_Balasubramanian_Resume.pdf
      # Resolved in shell: a user site's base_path is "", which `||` in an expression would treat as missing.
      - name: Resolve base path and site URL
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$PAGES_OUTCOME" = "success" ]; then
            base="$PAGES_BASE"; url="$PAGES_URL"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            base=""; url="https://$REPO"
          else
            base="/$REPO"; url="https://$OWNER.github.io/$REPO"
          fi
          echo "PAGES_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=$url" >> "$GITHUB_ENV"
          echo "base path: '$base' · site url: $url"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
